<style>

#printArea{display:none}

<body>
<div id="app"></div>
<div id="printArea"></div>
<script>
"use strict";
const ENDPOINT = "/api/api"; // Vercel Function (api/api.js): semua system instruction ada di server
const MAX_PHOTOS = 5;
const SUBJECTS = ["Mathematics","Physics","Chemistry","Biology","Indonesian Language","English Language","History","Geography","Economics","Sociology","Civics","Computer Science","Arts & Culture","Religious Education","Physical Education","Other"];
const SORTS = ["Recently updated","Newest created","Oldest created","Title A–Z","Title Z–A","Subject"];
const TIPS = ["Tip: highlighted colors group the same kind of information.","Tip: ask the chat to make practice questions from your lesson.","Tip: turn on Reasoning for a more accurate result.","Tip: tap a photo to preview it in full size.","Tip: temporary Study Halls are erased when you leave."];

/* ═════════════ Utilitas ═════════════ */
/* append() yang menerima array bersarang & mengabaikan null/false */
const _append = Element.prototype.append;
Element.prototype.append = function (...k) { return _append.apply(this, k.flat(Infinity).filter(c => c !== null && c !== undefined && c !== false)); };
const $ = (s, r = document) => r.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k in e && k !== "list") try { e[k] = v; } catch { e.setAttribute(k, v); }
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const fmtDate = t => new Date(t).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Kapital otomatis di awal kalimat untuk semua kolom input */
function capitalize(v) { return v.replace(/(^|[.!?]\s+|\n\s*)([a-zà-ɏ])/g, (m, a, b) => a + b.toUpperCase()); }
document.addEventListener("input", e => {
  const el = e.target;
  if (!(el instanceof HTMLTextAreaElement || (el instanceof HTMLInputElement && (el.type === "text" || el.type === "search"))) || e.isComposing) return;
  const nv = capitalize(el.value);
  if (nv !== el.value) { const s = el.selectionStart, en = el.selectionEnd; el.value = nv; try { el.setSelectionRange(s, en); } catch {} }
}, true);
function field(tag, attrs) { const e = h(tag, { autocapitalize: "sentences", ...attrs }); return e; }

/* ═════════════ Penyimpanan (IndexedDB) ═════════════ */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open("smry", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("halls", { keyPath: "id" });
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(mode, fn) { return new Promise((res, rej) => { const t = this.db.transaction("halls", mode); const rq = fn(t.objectStore("halls")); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); }); },
  all() { return this.tx("readonly", s => s.getAll()); },
  put(x, silent) { return this.tx("readwrite", s => s.put(x)).then(r => { if (!silent) Cloud.schedule(); return r; }); },
  del(id, silent) { return this.tx("readwrite", s => s.delete(id)).then(r => { if (!silent) Cloud.schedule(); return r; }); }
};


/* ═════════════ Cloud sync (Vercel Blob lewat /api/sync · identitas = Firebase Authentication) ═════════════ */
const SYNC = "/api/sync";
let settingsFill = null;
const Cloud = {
  token: "", user: LS.get("cloudUser", null),
  last: LS.get("cloudLast", 0), running: false, again: false, status: "", timer: null, fbReady: null, auth: null, fa: null,
  signedIn() { return !!this.user; },
  tombs() { return LS.get("cloudTombs", {}); },
  tomb(id) { const t = this.tombs(); t[id] = Date.now(); LS.set("cloudTombs", t); },
  setStatus(msg, clearAfter) {
    this.status = msg; const e = $("#subtitle"); if (e) e.textContent = msg || "Summarize your lessons";
    if (msg && clearAfter) setTimeout(() => { if (this.status === msg) this.setStatus(""); }, clearAfter);
  },
  /* Firebase Authentication (SDK dimuat dari CDN gstatic saat pertama dibutuhkan; konfigurasi diambil dari server) */
  initFirebase() {
    if (this.fbReady) return this.fbReady;
    return (this.fbReady = (async () => {
      const r = await fetch(SYNC, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "config" }) });
      const j = await r.json().catch(() => ({}));
      const cfg = j.firebase;
      if (!r.ok || !cfg || !cfg.apiKey || !cfg.projectId) throw new Error(j.error || "Cloud sync is not configured on the server (FIREBASE_PROJECT_ID, FIREBASE_API_KEY).");
      const V = "https://www.gstatic.com/firebasejs/10.14.1/";
      let app, fa;
      try { [app, fa] = await Promise.all([import(V + "firebase-app.js"), import(V + "firebase-auth.js")]); }
      catch { throw new Error("Could not load Firebase sign-in."); }
      this.fa = fa; this.auth = fa.getAuth(app.initializeApp(cfg));
      await this.auth.authStateReady();
    })().catch(e => { this.fbReady = null; throw e; }));
  },
  authError(e) {
    const c = (e && e.code) || "";
    if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") return "Sign-in cancelled.";
    if (c === "auth/popup-blocked") return "The sign-in popup was blocked. Allow popups for this site and try again.";
    if (c === "auth/unauthorized-domain") return "This domain is not authorized in Firebase (Authentication → Settings → Authorized domains).";
    if (c === "auth/operation-not-allowed") return "Google sign-in is not enabled in Firebase (Authentication → Sign-in method).";
    return (e && e.message) || "Sign-in failed.";
  },
  async signIn() {
    if (!this.auth) await this.initFirebase();
    const prov = new this.fa.GoogleAuthProvider(); prov.setCustomParameters({ prompt: "select_account" });
    const r = await this.fa.signInWithPopup(this.auth, prov);
    this.token = await r.user.getIdToken();
    this.user = { email: r.user.email || "", name: r.user.displayName || "" };
    LS.set("cloudUser", this.user);
    if (settingsFill) settingsFill();
    this.sync();
  },
  renderButton(div) {
    const msg = h("p", { class: "err small" });
    const btn = h("button", { class: "out", disabled: true, onclick: async () => {
      btn.disabled = true; msg.textContent = "";
      try { await this.signIn(); } catch (e) { btn.disabled = false; msg.textContent = this.authError(e); }
    } }, "Sign in with Google");
    div.append(btn, msg);
    // Dimuat dulu supaya popup login langsung terbuka saat tombol diklik (tidak diblokir browser).
    this.initFirebase().then(() => { btn.disabled = false; }, e => { msg.textContent = e.message; });
  },
  async ensureToken() {
    await this.initFirebase();
    const u = this.auth.currentUser;
    if (!u) {
      this.token = ""; this.user = null; LS.set("cloudUser", null);
      if (settingsFill) settingsFill();
      throw new Error("Session expired. Open Settings and sign in again.");
    }
    return (this.token = await u.getIdToken()); // diperbarui otomatis oleh Firebase bila hampir kedaluwarsa
  },
  signOut() {
    try { if (this.auth) this.fa.signOut(this.auth); } catch {}
    this.token = ""; this.user = null; this.last = 0;
    LS.set("cloudUser", null); LS.set("cloudLast", 0);
    if (settingsFill) settingsFill();
  },
  /* Jadwalkan sync (debounce). Tidak jalan saat Study Hall sedang terbuka supaya data yang sedang diedit tidak tertimpa. */
  schedule() {
    if (!this.signedIn()) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { this.timer = null; this.sync(); }, 2500); // setelah perubahan terakhir selesai disimpan
  },
  async api(body) {
    let r;
    try { r = await fetch(SYNC, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + this.token }, body: JSON.stringify(body) }); }
    catch { throw new Error("Cannot reach the sync server."); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { if (r.status === 401) this.token = ""; throw new Error(j.error || "Sync failed (HTTP " + r.status + ")."); }
    return j;
  },
  toCloud(x) {
    return { id: x.id, title: x.title, subject: x.subject, userPrompt: x.prompt || "", createdAt: x.createdAt, updatedAt: x.updatedAt, summary: x.summary,
      messages: x.messages.map(m => ({ user: !!m.user, text: m.text, createdAt: m.createdAt || x.updatedAt })) };
  },
  fromCloud(j, photos) {
    const s = j.summary || {};
    return { id: j.id, title: j.title || "", subject: j.subject || "", prompt: j.userPrompt || "", createdAt: j.createdAt || Date.now(), updatedAt: j.updatedAt || Date.now(),
      summary: { ...s, title: s.title || j.title || "", summary: s.summary || "", keyPoints: s.keyPoints || [], explanation: s.explanation || "", legend: s.legend || [] },
      photos, messages: (j.messages || []).map(m => ({ user: !!m.user, text: m.text || "", createdAt: m.createdAt || 0 })) };
  },
  async push(x, withPhotos) {
    if (withPhotos) for (let i = 0; i < x.photos.length; i++) await this.api({ action: "putPhoto", id: x.id, n: i, data: x.photos[i] });
    await this.api({ action: "put", hall: this.toCloud(x), photos: x.photos.length });
  },
  async pull(id, n, existing) {
    const j = (await this.api({ action: "get", id })).hall;
    let photos;
    if (existing && existing.photos.length === n) photos = existing.photos;
    else { photos = []; for (let i = 0; i < n; i++) photos.push((await this.api({ action: "getPhoto", id, n: i })).data); }
    await DB.put(this.fromCloud(j, photos), true);
  },
  async sync(quiet) {
    if (!this.signedIn()) return;
    if (this.running) { this.again = true; return; } // ada perubahan saat sync berjalan → ulangi setelah selesai
    this.running = true; if (!quiet) this.setStatus("☁ Syncing…");
    let msg = "", ok = true, changed = true;
    const openId = App.view === "hall" && !App.temp ? App.hallId : null; // hall yang sedang dibuka tidak ditimpa dari cloud
    try {
      await this.ensureToken();
      const manifest = (await this.api({ action: "manifest" })).halls || {};
      let up = 0, down = 0, removed = 0;
      const tombs = this.tombs();
      for (const [id, t] of Object.entries(tombs)) {
        const r = manifest[id];
        if (!(r && r.deleted && r.updatedAt >= t)) {
          const resp = await this.api({ action: "delete", id, updatedAt: t });
          manifest[id] = resp.applied ? { updatedAt: t, deleted: true, photos: 0 } : (resp.remote || manifest[id]);
        }
        delete tombs[id]; LS.set("cloudTombs", tombs);
      }
      const locals = await DB.all(), byId = new Map(locals.map(x => [x.id, x]));
      for (const x of locals) {
        const r = manifest[x.id];
        if (!r) { await this.push(x, true); up++; }
        else if (r.deleted) { if (r.updatedAt >= x.updatedAt) { if (x.id !== openId) { await DB.del(x.id, true); removed++; } } else { await this.push(x, true); up++; } }
        else if (x.updatedAt > r.updatedAt) { await this.push(x, (r.photos || 0) < x.photos.length); up++; }
        else if (r.updatedAt > x.updatedAt) { if (x.id !== openId) { await this.pull(x.id, r.photos || 0, x); down++; } }
      }
      for (const [id, r] of Object.entries(manifest)) if (!r.deleted && !byId.has(id)) { await this.pull(id, r.photos || 0, null); down++; }
      this.last = Date.now(); LS.set("cloudLast", this.last);
      if (App.view === "home") App.halls = await DB.all(); // di layar lain daftar disegarkan saat kembali ke home
      changed = up + down + removed > 0;
      msg = up + down + removed === 0 ? "Already in sync." : "Synced: " + up + " uploaded, " + down + " downloaded" + (removed ? ", " + removed + " removed" : "") + ".";
    } catch (e) { ok = false; msg = e.message; }
    this.running = false;
    if (!(quiet && ok && !changed)) { // pengecekan otomatis yang tidak mengubah apa pun: diam, tanpa render ulang
      this.setStatus("☁ " + msg, ok ? 4000 : 9000);
      Cloud.lastMessage = (ok ? "" : "⚠ ") + msg;
      if (settingsFill) settingsFill();
      if (App.view === "home") rerender();
    }
    if (this.again) { this.again = false; if (ok) this.schedule(); }
  }
};

/* ═════════════ Model data ═════════════ */
const stripHL = s => (s || "").replace(/\[\[#[0-9a-fA-F]{3,8}\|([\s\S]*?)\]\]/g, "$1");
function contextText(s) {
  return [s.title, s.summary, ...s.keyPoints.map(k => "- " + k), s.explanation].map(stripHL).join("\n");
}

/* ═════════════ Parser respons AI ═════════════ */
function sections(text, names) {
  text = text.replace(/```[a-z]*\n?/gi, "").trim();
  const re = new RegExp("^(" + names.join("|") + "):[ \\t]*", "gm");
  const hits = [...text.matchAll(re)];
  const out = {};
  hits.forEach((m, i) => { out[m[1]] = text.slice(m.index + m[0].length, i + 1 < hits.length ? hits[i + 1].index : undefined).trim(); });
  return out;
}
const bullets = t => (t || "").split("\n").map(l => l.trim()).filter(l => /^[-•*]\s+/.test(l)).map(l => l.replace(/^[-•*]\s+/, ""));
const legendOf = t => (t || "").split("\n").map(l => l.trim().match(/^(#[0-9a-fA-F]{3,8})\s*=\s*(.+)$/)).filter(Boolean).map(m => ({ color: m[1], meaning: m[2] }));
function parseSummary(raw) {
  const s = sections(raw, ["TITLE", "SUMMARY", "KEY POINTS", "EXPLANATION", "LEGEND"]);
  if (!s.TITLE || !s.SUMMARY) throw new Error("The AI answer was not in the expected format.");
  return { title: s.TITLE.split("\n")[0].trim(), summary: s.SUMMARY, keyPoints: bullets(s["KEY POINTS"]), explanation: s.EXPLANATION || "", legend: legendOf(s.LEGEND) };
}
function parseOverall(raw) {
  const s = sections(raw, ["OVERVIEW", "TOPICS", "DETAILS", "LEGEND"]);
  if (!s.OVERVIEW) throw new Error("The AI answer was not in the expected format.");
  const details = [];
  (s.DETAILS || "").split(/^##\s+/m).slice(1).forEach(b => { const i = b.indexOf("\n"); details.push({ topic: (i < 0 ? b : b.slice(0, i)).trim(), explanation: (i < 0 ? "" : b.slice(i)).trim() }); });
  return { overview: s.OVERVIEW, topics: bullets(s.TOPICS), details, legend: legendOf(s.LEGEND) };
}

/* ═════════════ Klien AI (/api/api → Gemini) ═════════════ */
// instruction: "summary" | "overall" | "chat"; payload: { mode, message, draft, vars }
async function llm(instruction, payload, images, onPartial, signal) {
  const body = { instruction, ...payload, images: images || [] };
  let res;
  try { res = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal }); }
  catch (e) { if (e.name === "AbortError") throw e; throw new Error("Connection to the server failed or timed out."); }
  if (!res.ok) {
    let msg = "Request failed (HTTP " + res.status + ").";
    try { const j = await res.json(); if (j.error) msg = String(j.error); } catch {}
    throw new Error(msg);
  }
  const rd = res.body.getReader(), dec = new TextDecoder();
  let out = "";
  for (;;) {
    const { done, value } = await rd.read();
    if (done) break;
    out += dec.decode(value, { stream: true });
    onPartial && onPartial(out);
  }
  return out.trim();
}

const basePrompt = (subject, user, n) => "Subject: " + subject + "\nUser's custom instruction: " + (user || "(none)") + "\n\nThe lesson photos are attached (" + n + " photo" + (n === 1 ? "" : "s") + ", in order).";
async function summarize(images, subject, userPrompt, reasoning, status, signal) {
  const message = basePrompt(subject, userPrompt, images.length);
  const pass = async draft => {
    for (let t = 0; ; t++) {
      try { return parseSummary(await llm("summary", { mode: draft ? "review" : "draft", message, draft }, images, null, signal)); }
      catch (e) { if (e.name === "AbortError" || t >= 1) throw e; }
    }
  };
  status(reasoning ? "Reasoning 1 of 3: drafting…" : "Analyzing and summarizing (AI)…");
  let best = await pass(null);
  if (reasoning) for (let p = 2; p <= 3; p++) {
    status("Reasoning " + p + " of 3: reviewing…");
    try { best = await pass(serializeSummary(best)); } catch (e) { if (e.name === "AbortError") throw e; }

}

/* ═════════════ Render teks: Markdown + highlight + LaTeX ═════════════ */
function mathHTML(tex, display) {
  if (window.katex) { try { return katex.renderToString(tex, { displayMode: display, throwOnError: false }); } catch {} }
  return "<code>" + esc(tex) + "</code>";
}
function inline(t) {
  t = esc(t);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\[\[(#[0-9a-fA-F]{3,8})\|([\s\S]*?)\]\]/g, '<mark style="background:$1">$2</mark>');
  t = t.replace(/\*\*([^*]+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*(?!\s)([^*]+?)\*(?=$|[\s).,;:!?])/g, "$1<i>$2</i>");
  return t;
}
function md(src) {
  const maths = [];
  src = (src || "").replace(/\r/g, "")
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => "\u0000" + (maths.push([t, true]) - 1) + "\u0000")
    .replace(/(?<![\\$])\$([^$\n]+?)\$(?!\d)/g, (m, t) => "\u0000" + (maths.push([t, false]) - 1) + "\u0000");
  const out = []; let para = [], code = null;
  const flush = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  for (const line of src.split("\n")) {
    const t = line.trim(); let m;
    if (code !== null) { if (t.startsWith("```")) { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; } else code.push(line); continue; }
    if (t.startsWith("```")) { flush(); code = []; continue; }
    if (!t) { flush(); continue; }
    if ((m = line.match(/^\s{0,3}(#{1,4})\s+(.*)$/))) { flush(); out.push('<h4 class="h' + m[1].length + '">' + inline(m[2]) + "</h4>"); }
    else if (/^\s*([-*_]\s*){3,}$/.test(line)) { flush(); out.push("<hr>"); }
    else if ((m = line.match(/^(\s*)[-*•]\s+(.*)$/))) { flush(); const l = Math.min(3, Math.floor(m[1].replace(/\t/g, "    ").length / 2)); out.push('<div class="li" style="margin-left:' + l * 1.2 + 'em"><span class="b">' + (l ? "◦" : "•") + "</span><span>" + inline(m[2]) + "</span></div>"); }
    else if ((m = line.match(/^(\s*)(\d{1,3})[.)]\s+(.*)$/))) { flush(); const l = Math.min(3, Math.floor(m[1].replace(/\t/g, "    ").length / 2)); out.push('<div class="li" style="margin-left:' + l * 1.2 + 'em"><span class="b">' + m[2] + ".</span><span>" + inline(m[3]) + "</span></div>"); }
    else if (t.startsWith(">")) { flush(); out.push("<blockquote>" + inline(t.replace(/^>+\s?/, "")) + "</blockquote>"); }
    else para.push(t);
  }
  if (code !== null) out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
  flush();
  return out.join("").replace(/<p>\u0000(\d+)\u0000<\/p>/g, (m, i) => maths[i][1] ? '<div class="disp">' + mathHTML(maths[i][0], true) + "</div>" : m.replace(/\u0000(\d+)\u0000/g, (_, j) => mathHTML(maths[j][0], false)))
    .replace(/\u0000(\d+)\u0000/g, (m, i) => mathHTML(maths[i][0], maths[i][1]));
}
const mdEl = (src, cls) => h("div", { class: "md " + (cls || ""), html: md(src) });

  return h("div", {}, legend.map(l => h("div", { class: "legend" }, h("span", { class: "sw", style: "background:" + l.color }), h("span", { class: "small" }, l.meaning))));

function fileToJpeg(file, max = 1400, q = 0.75) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const sc = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas"); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Cannot read image")); };
    im.src = url;
  });
}

    hall.messages.forEach(m => msgBox.append(h("div", { class: "bubble " + (m.user ? "user" : "bot") }, mdEl(m.text))));

}

/* ═════════════ Mulai ═════════════ */
render = () => {
  document.querySelectorAll(".menu").forEach(m => m.remove());
  const keepScroll = null;
  root.innerHTML = "";
  root.append(App.view === "wizard" ? wizardScreen() : App.view === "hall" ? hallScreen() : mainScreen());
};
window.addEventListener("beforeunload", e => { if (App.tempHall) { e.preventDefault(); e.returnValue = ""; } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
(async () => {
  applyTheme(); applyWake();
  try {
    await DB.open();
    const cutoff = Date.now() - 30 * 864e5;
    const all = await DB.all();
    if (Cloud.signedIn()) App.halls = all; // dengan cloud sync, penghapusan otomatis 30 hari dijeda
    else { for (const x of all) if (x.updatedAt < cutoff) await DB.del(x.id, true); App.halls = all.filter(x => x.updatedAt >= cutoff); }
  } catch (e) { toast("Storage unavailable: " + e.message); }
  render();
  if (Cloud.signedIn()) Cloud.sync();
})();
/* Klik kanan / tekan lama: menu bawaan browser dimatikan, diganti menu kustom.
   Kolom ketik (input/textarea) tetap memakai menu bawaan agar tempel/salin tetap bisa. */
document.addEventListener("contextmenu", e => {
  const t = e.target instanceof Element ? e.target : document.body;
  if (t.closest("input,textarea,[contenteditable=true]")) return;
  e.preventDefault();
  if (document.querySelector(".overlay,.lightbox,.camlay")) return; // saat dialog/preview terbuka: tidak ada menu
  const items = [], sel = String(getSelection()).trim(), bub = t.closest(".bubble");
  if (sel) items.push(["Copy", () => copyText(sel)]);
  else if (bub) items.push(["Copy message", () => copyText(bub.innerText)]);
  items.push(["Settings", openSettings]);
  if (Cloud.signedIn()) items.push(["Sync now", () => Cloud.sync()]);
  popMenuAt(e.clientX, e.clientY, items);
});

/* Sync otomatis dua arah: tiap perubahan selesai (lihat DB.put/del → Cloud.schedule), saat tab kembali aktif / online,
   dan cek berkala tiap SYNC_POLL_MS untuk mengambil perubahan dari perangkat lain. */
const SYNC_POLL_MS = 60000;
setInterval(() => { if (document.visibilityState === "visible" && Cloud.signedIn() && navigator.onLine !== false) Cloud.sync(true); }, SYNC_POLL_MS);
window.addEventListener("online", () => { if (Cloud.signedIn()) Cloud.sync(); });
document.addEventListener("visibilitychange", () => {
  if (!Cloud.signedIn()) return;
  if (document.visibilityState === "visible") { if (Date.now() - Cloud.last > 15000) Cloud.sync(true); }
  else if (Cloud.timer) { clearTimeout(Cloud.timer); Cloud.timer = null; Cloud.sync(true); } // kirim perubahan tertunda sebelum tab ditinggalkan
});
